name: OpenWispr
options:
  bundleIdPrefix: de.keno
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Signing comes from the environment (see Makefile / Local.mk). Defaults to ad-hoc.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "${CODE_SIGN_IDENTITY}"
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.17.7"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "1.10.0"
targets:
  OpenWispr:
    type: application
    platform: macOS
    sources:
      - path: OpenWispr
        excludes:
          - "Resources/Info.plist"
      - path: ../shared/prompts
        type: folder
        buildPhase: resources
    dependencies:
      - package: FluidAudio
      - package: KeyboardShortcuts
    info:
      path: OpenWispr/Resources/Info.plist
      properties:
        CFBundleName: OpenWispr
        CFBundleDisplayName: OpenWispr
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleIconFile: ""
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSMicrophoneUsageDescription: "OpenWispr records your voice and turns it into text locally on this Mac."
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.keno.openwispr
        GENERATE_INFOPLIST_FILE: NO
  OpenWisprTests:
    type: bundle.unit-test
    platform: macOS
    sources: [OpenWisprTests]
    dependencies:
      - target: OpenWispr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.keno.openwispr.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OpenWispr:
    build:
      targets:
        OpenWispr: all
        OpenWisprTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [OpenWisprTests]

name: Secret scan

on: [push, pull_request]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the full git history with gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest git --no-banner --redact --exit-code 1 /repo

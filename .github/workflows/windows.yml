name: Windows

on:
  push:
    branches: [main]
    paths: ["windows/**", "shared/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "shared/**", ".github/workflows/windows.yml"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        working-directory: windows
        run: dotnet restore
      - name: Test core
        working-directory: windows
        run: dotnet test OpenWispr.Core.Tests --no-restore -c Release
      - name: Publish app
        working-directory: windows
        run: dotnet publish OpenWispr.Windows -c Release -r win-x64 --self-contained false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: OpenWispr-Windows
          path: windows/publish
